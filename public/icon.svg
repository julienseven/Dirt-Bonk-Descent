<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Dirt Bonk Descent">
  <!--
    Brand favicon — golden-hour descent + rider silhouette + BONK star.
    Palette matches in-game HUD: gold #ffd400, hot #ff2e88, mint #2fe6c8.
    Grouped for clarity; ids prefixed (dbd-) so the mark stays safe if inlined.
  -->
  <defs>
    <linearGradient id="dbd-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#163566"/>
      <stop offset="0.48" stop-color="#7eb4d8"/>
      <stop offset="1" stop-color="#f0a86a"/>
    </linearGradient>
    <linearGradient id="dbd-dirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c49252"/>
      <stop offset="1" stop-color="#5e3f24"/>
    </linearGradient>
    <linearGradient id="dbd-ridge-far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8bdd4"/>
      <stop offset="1" stop-color="#6d87a8"/>
    </linearGradient>
    <linearGradient id="dbd-ridge-near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5d7d9c"/>
      <stop offset="1" stop-color="#3a5570"/>
    </linearGradient>
  </defs>

  <!-- clip to rounded app-icon square -->
  <clipPath id="dbd-frame">
    <rect width="64" height="64" rx="12"/>
  </clipPath>

  <g clip-path="url(#dbd-frame)">
    <!-- sky -->
    <rect width="64" height="64" fill="url(#dbd-sky)"/>

    <!-- sun bloom -->
    <circle cx="50" cy="14" r="10" fill="#ffe7a8" opacity="0.55"/>
    <circle cx="50" cy="14" r="5.5" fill="#fff3c8" opacity="0.9"/>

    <!-- distant ridges (paler = farther — same depth cue as the game) -->
    <path fill="url(#dbd-ridge-far)" opacity="0.7"
          d="M0 32 L10 20 L18 28 L28 16 L40 27 L50 18 L64 30 V42 H0 Z"/>
    <path fill="url(#dbd-ridge-near)"
          d="M0 37 L12 26 L24 35 L36 24 L48 34 L64 26 V46 H0 Z"/>

    <!-- dirt trail sweeping downhill -->
    <path fill="url(#dbd-dirt)"
          d="M-2 44 Q16 45 28 51 T66 58 V66 H-2 Z"/>
    <!-- tire groove -->
    <path fill="none" stroke="#4a321c" stroke-width="1.8" stroke-linecap="round" opacity="0.55"
          d="M0 48 Q18 50 30 56 T64 62"/>
    <!-- berm lip highlight -->
    <path fill="none" stroke="#e0b878" stroke-width="1.2" stroke-linecap="round" opacity="0.45"
          d="M0 45 Q18 46 30 52 T64 58"/>

    <!-- rider + bike (leaning into the descent; reads at 16px) -->
    <g transform="translate(27 31) rotate(-16)" stroke-linecap="round" stroke-linejoin="round">
      <!-- roost spray -->
      <path fill="#e8c896" opacity="0.8"
            d="M-5 11 q-10 1 -15 7 q8 -2 14 -4 z"/>

      <!-- wheels -->
      <circle cx="-7.5" cy="10" r="5.6" fill="none" stroke="#121218" stroke-width="2.7"/>
      <circle cx="9" cy="10" r="5.6" fill="none" stroke="#121218" stroke-width="2.7"/>
      <!-- hub dots (legibility at mid sizes) -->
      <circle cx="-7.5" cy="10" r="1.1" fill="#121218"/>
      <circle cx="9" cy="10" r="1.1" fill="#121218"/>

      <!-- frame — brand gold -->
      <path fill="none" stroke="#ffd400" stroke-width="2.3"
            d="M-7.5 10 L1 2.5 L9 10 M1 2.5 L2 10 L-7.5 10"/>

      <!-- rider torso + arms — hot pink jersey cue -->
      <path fill="none" stroke="#ff2e88" stroke-width="3.5"
            d="M-1 1.5 L4 -4.5 L9.5 -1"/>
      <!-- helmet -->
      <circle cx="4" cy="-7.2" r="4.3" fill="#fff0d0"/>
      <!-- goggle stripe — mint -->
      <path fill="none" stroke="#2fe6c8" stroke-width="1.9"
            d="M1 -8.7 H7.2"/>
    </g>

    <!-- BONK impact star -->
    <g transform="translate(50 19)">
      <path fill="#ffd400" stroke="#101014" stroke-width="1.35" stroke-linejoin="round"
            d="M0 -7.2 L1.8 -2.2 L7  -1.6 L3.1 1.8 L4.2 7 L0 4.2 L-4.2 7 L-3.1 1.8 L-7 -1.6 L-1.8 -2.2 Z"/>
    </g>
  </g>
</svg>
